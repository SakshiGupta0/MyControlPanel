name: Build, test & release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_without_emulator:
        description: "Publish even if the emulator job failed (only after its tests passed on an earlier run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile + core tests + APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core logic tests (scheduler, routines, editors, reset, persistence)
        run: |
          ./gradlew --no-daemon --console=plain testDebugUnitTest > unit.log 2>&1 || (grep -E "^e: |error:|What went wrong|FAILED|Unresolved|Caused by" unit.log | head -60 | sed 's/^/::error title=build::/' ; exit 1)
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MyControlPanel-v${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
      - name: Report failed unit tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in tc.findall('failure'):
                      print(f"::error title={tc.get('name')}::{(fl.get('message') or '')[:1800]}")
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  ui-tests:
    name: Emulator smoke tests (${{ matrix.device }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: [pixel_c, pixel_4]   # tablet + phone
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          ls -l /dev/kvm && echo "::notice title=kvm::/dev/kvm present" || echo "::error title=kvm::/dev/kvm missing on this runner"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke tests on emulator
        id: smoke1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: ${{ matrix.device }}
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --console=plain connectedDebugAndroidTest > connected.log 2>&1 || (grep -E "FAILED|Exception|INSTALL_|error:|What went wrong|Caused by|offline|Timed out" connected.log | head -40 | sed 's/^/::error title=connected::/' ; exit 1)
      - name: Run smoke tests on emulator (retry once if the emulator flaked)
        if: steps.smoke1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: ${{ matrix.device }}
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --console=plain connectedDebugAndroidTest > connected.log 2>&1 || (grep -E "FAILED|Exception|INSTALL_|error:|What went wrong|Caused by|offline|Timed out" connected.log | head -40 | sed 's/^/::error title=connected::/' ; exit 1)
      - name: Report failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fl.text or fl.get('message') or '').strip().replace('\n', ' | ')[:1800]
                      print(f"::error title={tc.get('name')}::{msg}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-report-${{ matrix.device }}
          path: app/build/reports/androidTests/

  release:
    name: Publish APK
    needs: [build, ui-tests]
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request' && (needs.ui-tests.result == 'success' || inputs.release_without_emulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out
      - name: Read version
        run: echo "APK=$(ls out/*.apk)" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: My Control Panel — build ${{ github.run_number }}
          body: |
            Passed: core logic tests + emulator smoke tests.
            Install: open this page on the tablet, tap the .apk below, allow "Install unknown apps" for your browser if asked.
            Installs over the previous build and keeps your settings.
          files: ${{ env.APK }}
          make_latest: true
